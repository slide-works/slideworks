services:
  slide-works:
    build: .
    restart: unless-stopped
    ports:
      # Localhost only: the TLS proxy is the public entry point. Published on
      # every interface, a request sent straight to 8080 can arrive from inside
      # a trusted Docker network (rootless Docker, Docker Desktop) and pick its
      # own rate-limit key through X-Forwarded-For.
      - "127.0.0.1:8080:8080"
    # Set the values in an untracked .env next to this file. docs/self-hosting.md
    # describes every setting.
    environment:
      # Required: the URL people and agents reach SlideWorks at (links, MCP and
      # OAuth metadata and the sign-in callback are built from it). The app
      # refuses to start without it.
      - SLIDEWORKS_PUBLIC_URL=${SLIDEWORKS_PUBLIC_URL:-}
      # Optional: a short domain for audience join links, an origin with no path
      # (such as https://slideworks.live). Unset, join links use the public URL.
      - SLIDEWORKS_JOIN_URL=${SLIDEWORKS_JOIN_URL:-}
      # Required: signs the short-lived render tokens headless pages use (at least
      # 32 random characters, e.g. `openssl rand -base64 32`). The app refuses to
      # start without it.
      - RenderTokens__Key=${SLIDEWORKS_RENDER_TOKEN_KEY:-}
      # Sign in with Google: on only when both are set. Register
      # <SLIDEWORKS_PUBLIC_URL>/signin-google as the client's redirect URI.
      - SLIDEWORKS_GOOGLE_CLIENT_ID=${SLIDEWORKS_GOOGLE_CLIENT_ID:-}
      - SLIDEWORKS_GOOGLE_CLIENT_SECRET=${SLIDEWORKS_GOOGLE_CLIENT_SECRET:-}
      # The first admin's Google email, honoured only while no admin exists.
      - SLIDEWORKS_ADMIN_EMAIL=${SLIDEWORKS_ADMIN_EMAIL:-}
      - SLIDEWORKS_DB_PATH=/data/slide-works.db
      # Uploaded images go under images/<deck id>/ here.
      - SLIDEWORKS_DATA_PATH=/data
      # Console only until SLIDEWORKS_SEQ_URL is set.
      - SLIDEWORKS_SEQ_URL=${SLIDEWORKS_SEQ_URL:-}
      - SLIDEWORKS_SEQ_API_KEY=${SLIDEWORKS_SEQ_API_KEY:-}
      # Behind a TLS proxy: the proxy's CIDR, such as 172.18.0.0/16, so the OAuth
      # rate limits count each client, not the proxy. Unset trusts no proxy.
      - SLIDEWORKS_TRUSTED_PROXIES=${SLIDEWORKS_TRUSTED_PROXIES:-}
      # Share emails go through any SMTP server (STARTTLS). No host means no emails;
      # sharing still works. Unset values keep the defaults.
      - SLIDEWORKS_SMTP_HOST=${SLIDEWORKS_SMTP_HOST:-}
      # Default 587.
      - SLIDEWORKS_SMTP_PORT=${SLIDEWORKS_SMTP_PORT:-}
      - SLIDEWORKS_SMTP_USERNAME=${SLIDEWORKS_SMTP_USERNAME:-}
      # With Resend the password is the API key, which the hosted instance keeps as
      # RESEND_KEY, so it is read from there when this is not set.
      - SLIDEWORKS_SMTP_PASSWORD=${SLIDEWORKS_SMTP_PASSWORD:-${RESEND_KEY:-}}
      # The From of share emails, such as "SlideWorks <share@mail.example.com>".
      - SLIDEWORKS_MAIL_FROM=${SLIDEWORKS_MAIL_FROM:-}
      # Sharing limits. Distinct new people one person may add to their decks in an
      # hour (default 10) and in 24 hours (default 30), and share emails one address
      # may get in 24 hours from everyone (default 3).
      - SLIDEWORKS_SHARE_NEW_PER_HOUR=${SLIDEWORKS_SHARE_NEW_PER_HOUR:-}
      - SLIDEWORKS_SHARE_NEW_PER_DAY=${SLIDEWORKS_SHARE_NEW_PER_DAY:-}
      - SLIDEWORKS_SHARE_EMAILS_PER_RECIPIENT_PER_DAY=${SLIDEWORKS_SHARE_EMAILS_PER_RECIPIENT_PER_DAY:-}
    volumes:
      # Named volume on a local disk. Never switch this to a bind mount on a
      # network share (NFS, SMB, 9p): SQLite corrupts there under lock
      # contention. Compose names it src_slide-works-data when run from src/;
      # docs/self-hosting.md (Storage) has the backup command.
      - slide-works-data:/data

volumes:
  slide-works-data:
