services:
  slide-works:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Set in an untracked .env next to this file. Empty/unset token means the
      # app fails closed (everything except /health rejected).
      - SLIDEWORKS_API_TOKEN=${SLIDEWORKS_API_TOKEN:-}
      - SLIDEWORKS_API_EXTRA_TOKENS=${SLIDEWORKS_API_EXTRA_TOKENS:-}
      - SLIDEWORKS_DB_PATH=/data/slide-works.db
      # Required: the URL people and agents reach SlideWorks at (links, MCP and
      # OAuth metadata are built from it). The app refuses to start without it.
      - SLIDEWORKS_PUBLIC_URL=${SLIDEWORKS_PUBLIC_URL:-}
      # Required: signs the short-lived render tokens headless pages use (at least
      # 32 random characters, e.g. `openssl rand -base64 32`). The app refuses to
      # start without it.
      - RenderTokens__Key=${SLIDEWORKS_RENDER_TOKEN_KEY:-}
      # Console only until these are set; on the home stack Seq is
      # http://seq:5341 on arrnet.
      - SLIDEWORKS_SEQ_URL=${SLIDEWORKS_SEQ_URL:-}
      - SLIDEWORKS_SEQ_API_KEY=${SLIDEWORKS_SEQ_API_KEY:-}
    volumes:
      # Named volume: stays on the WSL2 ext4 disk. Never switch this to a bind
      # mount on a NAS/Windows path — SQLite corrupts over 9p/SMB under lock
      # contention. Back it up with `sqlite3 .backup` instead.
      - slide-works-data:/data

volumes:
  slide-works-data:
