<div class="page">
  <div class="head">
    <p class="kicker" data-slot="kicker"></p>
    <h2 class="headline" data-slot="headline"></h2>
  </div>
  <div class="cols">
    <div class="gauge">
      <p class="tag" data-slot="label"></p>
      <div class="dial">
        <div class="arc"></div>
        <div class="needle" data-var="--v: value"></div>
        <div class="hub"></div>
      </div>
      <div class="ends">
        <b class="end" data-slot="from"></b>
        <b class="end" data-slot="to"></b>
      </div>
    </div>
    <p class="text" data-slot="text"></p>
  </div>
</div>
