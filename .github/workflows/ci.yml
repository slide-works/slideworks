name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Acceptance tests drive a browser against the built SPA bundle; they have their own job below.
      - run: dotnet test src/SlideWorks.slnx --configuration Release --filter "FullyQualifiedName!~.AcceptanceTests"

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/SlideWorks.Client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/SlideWorks.Client/pnpm-lock.yaml
      # The tests serve the real bundle, so it is built first (into SlideWorks.WebApi/wwwroot).
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: src/SlideWorks.Client
      - run: dotnet build src/SlideWorks.AcceptanceTests --configuration Release
      - run: pwsh src/SlideWorks.AcceptanceTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test src/SlideWorks.AcceptanceTests --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/SlideWorks.Client
    steps:
      - uses: actions/checkout@v4
      # pnpm at the version package.json's packageManager pins; before setup-node, whose cache needs it.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/SlideWorks.Client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/SlideWorks.Client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

  playwright:
    runs-on: ubuntu-latest
    # Same image used to generate the committed screenshot snapshots. The
    # GitHub-hosted runner image and this container ship different font
    # packages even on matching Ubuntu versions, which is enough to break
    # every screenshot assertion; running inside the image itself is what
    # reliably matches.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-resolute
    defaults:
      run:
        working-directory: src/SlideWorks.Client
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request diffs against its base. Depth 1 does not contain that commit, and
          # --only-changed then refuses to guess.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/SlideWorks.Client/package.json
      - run: pnpm install --frozen-lockfile
      # A screenshot spec with no committed baseline writes one here instead of failing; a baseline that exists but
      # differs still fails. Baselines are only ever made in this container, never on a laptop. Playwright writes a
      # missing baseline but still fails that test, so the first run may fail, and the second reruns only its failed
      # tests, now with the written baselines: what fails there fails the job.
      # On a pull request, only the component tests that import a changed file run. main still runs the full set.
      - name: Component tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm run test-ct --update-snapshots=missing --only-changed="$PR_BASE" --pass-with-no-tests
          else
            pnpm run test-ct --update-snapshots=missing
          fi
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        continue-on-error: true
      - run: pnpm run test-ct --last-failed --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: src/SlideWorks.Client/playwright-report/
          retention-days: 14
      # The baselines this run wrote (untracked files in a -snapshots folder), at their repo paths, to be reviewed and
      # committed from the artifact.
      - name: Collect new screenshot baselines
        if: ${{ !cancelled() }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files --others --exclude-standard -- '*-snapshots/*' > new-baselines.txt
          cat new-baselines.txt
          mkdir -p ct-new-baselines
          if [ -s new-baselines.txt ]; then
            tar -cf - -T new-baselines.txt | tar -xf - -C ct-new-baselines
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ct-new-baselines
          path: src/SlideWorks.Client/ct-new-baselines/
          if-no-files-found: ignore
          retention-days: 14
      # A baseline that was missing passes the rerun above, so without this step a screenshot spec could merge with
      # no committed baseline and compare against nothing. The artifact is uploaded first, then the job fails.
      - name: Fail when a screenshot baseline was missing
        if: ${{ !cancelled() }}
        run: |
          if [ -s new-baselines.txt ]; then
            echo "::error::Screenshot baselines are not committed. Review the ct-new-baselines artifact and commit them:"
            cat new-baselines.txt
            exit 1
          fi

  # The production image builds, Chromium included (the share card renderer, L9).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t slide-works src
      - run: docker image ls slide-works
      # Smoke the built image as it ships (non-root app user): it starts, and its Chromium renders a share card. An
      # unknown deck gets the generic card, so this needs no seeded data.
      - name: container smoke
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e RenderTokens__Key="$(head -c 48 /dev/urandom | base64 | tr -d '/+=' | head -c 48)" \
            -e SLIDEWORKS_PUBLIC_URL=http://127.0.0.1:8080 slide-works
          for i in $(seq 1 60); do curl -sf -m 2 http://127.0.0.1:8080/health >/dev/null && break; sleep 1; done
          code=$(curl -s -m 60 -o card.png -w '%{http_code} %{content_type}' http://127.0.0.1:8080/api/cards/smoke.png)
          echo "card: $code"
          docker logs smoke | tail -20
          test "$code" = "200 image/png"
          python3 -c "import struct;d=open('card.png','rb').read(24);assert d[:8]==b'\x89PNG\r\n\x1a\n';assert struct.unpack('>II',d[16:24])==(1200,630),d[16:24]"
