name: CI caches

# Saves the Android build's Gradle and ccache caches. A cache saved on a pull request is visible to that pull request
# alone, so they are saved only from main (and from a manual run, to warm a branch); every pull request build then
# restores main's.
on:
  push:
    # TODO: drop the feature branch. GitHub can only dispatch a workflow that exists on main, so until this merges the
    # branch's cache runs are started by a push whose message contains [caches].
    branches: [main, feature/sw-946-app-v0]
  workflow_dispatch:

concurrency:
  group: ci-caches-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-caches:
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[caches]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-android-build
        with:
          save-caches: 'true'
